<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vertical Sidebar Menu</title>
    <link rel="stylesheet" href="2.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

    <div class="page-container">
        <aside class="sidebar-menu">
            <div class="sidebar-header">
                <div class="sidebar">
   <img src="img/15.jpg"  alt="User Profile" class="profile-pic-round">
     <center> <h3>HEMZ</h3> </center>
   <br>
   <br>
                </div>

            <nav class="main-nav-vertical">
                <ul class="vertical-menu-list">
                    <li><a href="index.html"><i class="fas fa-home"></i> Dashboard</a></li>
                    <li><a href="mailbox.html"><i class="fas fa-envelope"></i> Mailbox</a></li>
                    <li><a href="messages.html"><i class="fas fa-folder"></i> File Manager</a></li>
                    <li><a href="settings.html"><i class="fas fa-calendar"></i> Calender</a></li>
                    <li><a href="logout.html"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
                </ul>
            </nav>
        </aside>

    </div>

    <script src="2.js"></script>
     <div class="mailbox-container">
        <aside class="mailbox-sidebar">
            <div class="mailbox-header">
                <h2>Mailbox</h2>
                <button class="compose-btn"><i class="fas fa-pencil-alt"></i> Compose</button>
            </div>
            <ul class="mailbox-nav">
                <li class="nav-item active" data-category="inbox">
                    <i class="fas fa-inbox"></i> Inbox <span class="badge unread-count">3</span>
                </li>
                <li class="nav-item" data-category="sent">
                    <i class="fas fa-paper-plane"></i> Sent
                </li>
                <li class="nav-item" data-category="drafts">
                    <i class="fas fa-file-alt"></i> Drafts
                </li>
                <li class="nav-item" data-category="starred">
                    <i class="fas fa-star"></i> Starred
                </li>
                <li class="nav-item" data-category="trash">
                    <i class="fas fa-trash"></i> Trash
                </li>
            </ul>
        </aside>

        <main class="mailbox-main-content">
            <div class="message-list-section">
                <div class="message-list-header">
                    <h3>Inbox</h3>
                    <div class="actions">
                        <button class="refresh-btn"><i class="fas fa-sync-alt"></i></button>
                        </div>
                </div>
                <div class="message-list" id="messageList">
                    <div class="no-messages-placeholder">No messages in this category.</div>
                </div>
            </div>

            <div class="message-view-section">
                <div class="message-view-placeholder" id="messageViewPlaceholder">
                    Select a message to read.
                </div>
                <div class="message-view-content" id="messageViewContent">
                    <div class="message-view-header">
                        <h3 id="messageSubject"></h3>
                        <div class="message-actions">
                            <button class="reply-btn"><i class="fas fa-reply"></i> Reply</button>
                            <button class="forward-btn"><i class="fas fa-share"></i> Forward</button>
                            <button class="delete-message-btn"><i class="fas fa-trash-alt"></i> Delete</button>
                        </div>
                    </div>
                    <div class="message-meta">
                        <span id="messageFrom"></span>
                        <span id="messageDate"></span>
                    </div>
                    <div class="message-body" id="messageBody"></div>
                </div>
            </div>
        </main>
    </div>

    <script src="2.js"></script>
</body>
</html>
